name: Optimize portfolio images

on:
  push:
    branches: [main]
    paths:
      - "assets/img/portfolio/**"

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install Pillow

      - name: Resize, watermark, and convert new/changed photos to WebP
        run: python3 scripts/optimize_portfolio_images.py "${{ github.event.before }}" "${{ github.sha }}"

      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets/img/portfolio/ _portfolio/
          git commit -m "Auto-optimize and watermark newly uploaded portfolio photos"
          git pull --rebase origin main
          git push
