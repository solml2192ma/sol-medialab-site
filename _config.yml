title: SOL MEDIA LAB Inc.
url: "https://solmelab.com"
baseurl: ""

plugins:
  - jekyll-sitemap

collections:
  portfolio:
    output: true
    permalink: /projects/:slug/

defaults:
  - scope:
      path: "tools/led-wiring"
    values:
      sitemap: false
  - scope:
      path: ""
      type: portfolio
    values:
      layout: portfolio

exclude:
  - README.md
  - tools/led-wiring/README.md
  - tools/led-wiring/test/
  - tools/led-wiring/package.json
  - tools/led-wiring/start.bat
  - tools/led-wiring/serve.py
  - tools/led-wiring/AGENTS.md

sass:
  quiet_deps: true
