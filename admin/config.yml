backend:
  name: github
  repo: solml2192ma/sol-medialab-site
  branch: main
  base_url: https://decap-oauth-proxy-one.vercel.app
  auth_endpoint: api/auth

media_folder: "assets/img/portfolio"
public_folder: "/assets/img/portfolio"

# Automatically resize/compress photos in the browser before they're
# uploaded, so phone-camera originals (often several MB) don't bloat
# the repo or slow down the PROJECTS board pages.
media_libraries:
  default:
    config:
      max_file_size: 10000000
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1920
          height: 1920

publish_mode: simple

collections:
  - name: "portfolio"
    label: "게시글"
    label_singular: "게시글"
    folder: "_portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "URL 슬러그 (자동 생성 — 직접 수정하지 마세요)", name: "slug", widget: "hidden", required: false }
      - label: "등록일시 (자동 입력 — CMS 확인용, 홈페이지에는 노출되지 않습니다)"
        name: "post_date"
        widget: "datetime"
        default: "{{now}}"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        picker_utc: false
        required: true
      - label: "카테고리 (해당하는 항목 모두 선택)"
        name: "overview_category"
        widget: "select"
        multiple: true
        options:
          - "빌딩·오피스"
          - "백화점·쇼핑몰"
          - "분양홍보관·모델하우스"
          - "사이니지·모니터(설치)"
          - "컨퍼런스·세미나"
          - "전시·컨벤션"
          - "방송·촬영"
          - "공연·행사"
          - "사이니지·모니터(렌탈)"
          - "유지·보수"
          - "제품 유통"
        required: false
      - { label: "클라이언트", name: "client", widget: "hidden", required: false }
      - { label: "장소 (선택)", name: "location", widget: "string", required: false, hint: "시설명과 세부 장소를 입력해 주세요. 예시: 서울신라호텔 영빈관 루비홀" }
      - { label: "설치 지역 (선택)", name: "installation_region", widget: "string", required: false, hint: "시·군·구까지 입력해 주세요. 예시: 서울시 중구" }
      - { label: "설치 일자 (선택)", name: "installation_month", widget: "string", required: false, hint: "실제 설치 연도와 월을 입력해 주세요. 예시: 2026년 02월" }
      - label: "솔루션 (선택)"
        name: "installation_solution"
        widget: "select"
        required: false
        hint: "설치한 장비나 제공한 서비스를 선택해 주세요. 예시: P2mm LED전광판"
        options:
          - "LED전광판"
          - "P1mm LED전광판"
          - "P2mm LED전광판"
          - "P3mm LED전광판"
          - "P4mm LED전광판"
          - "Flexible 곡면형 커브드 LED전광판"
          - "70인치 이상 대형 모니터 사이니지"
          - "70인치 미만 모니터 사이니지"
          - "멀티비젼 비디오월"
          - "시스템 운영"
          - "유지 보수"
      - { label: "프로젝트명 (선택)", name: "installation_project", widget: "string", required: false, hint: "행사명이나 프로젝트명을 입력해 주세요. 예시: 홍콩만찬리셉션" }
      - { label: "대표 이미지", name: "cover_image", widget: "image" }
      - label: "추가 사진 (선택)"
        name: "gallery"
        widget: "list"
        field: { label: "이미지", name: "image", widget: "image" }
        required: false
      - label: "상세 설명"
        name: "body"
        widget: "markdown"
        modes: ["rich_text", "raw"]
