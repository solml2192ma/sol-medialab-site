<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LED 배선도면 | SOL MEDIA LAB Inc.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="company-brand">
    <img class="company-logo" src="assets/logo.png" alt="솔미디어랩 로고" width="87" height="40">
    <div class="company-name">
      <p class="company-ko">주식회사 솔미디어랩</p>
      <p class="company-en"><strong>SOL MEDIA LAB Inc.</strong></p>
    </div>
  </div>
  <h1 class="tool-title">
    <span class="tool-label">LED TOOL</span>
    <span class="tool-name">배선도면 (LAN &amp; POWER)</span>
  </h1>
</header>

<main>
  <form id="form" class="panel" autocomplete="off">
    <h2>입력</h2>
    <div class="row2">
      <label>가로 (mm)<input type="number" name="w" inputmode="numeric" min="500" step="500" value="" placeholder="500mm 단위" aria-describedby="wError"><span id="wError" class="size-error" aria-live="polite" hidden></span></label>
      <label>세로 (mm)<input type="number" name="h" inputmode="numeric" min="500" step="500" value="" placeholder="500mm 단위" aria-describedby="hError"><span id="hError" class="size-error" aria-live="polite" hidden></span></label>
    </div>
    <label>픽셀피치
      <select name="pitch"></select>
    </label>
    <label>캐비닛 규격
      <select name="cab"></select>
    </label>
    <div class="row3 custom" hidden>
      <label>캐비닛 가로<input type="number" name="cw" inputmode="decimal" min="1" step="any" value="500"></label>
      <label>캐비닛 세로<input type="number" name="ch" inputmode="decimal" min="1" step="any" value="500"></label>
      <label>1박스 수량<input type="number" name="boxQty" inputmode="numeric" min="1" step="1" placeholder="필수"></label>
    </div>
    <fieldset class="rowplan" id="rowPlanBox" hidden>
      <legend>행 배치 (위 → 아래)</legend>
      <input type="hidden" name="rows" value="">
      <button type="button" id="rowReset" class="ghost">기본 배치로</button>
      <ol id="rowPlanList" class="rowplan-list"></ol>
      <p class="hint">1000 줄을 500 두 줄로 나누거나, 줄 위치를 옮겨 배치를 바꿉니다. 바꾸면 직접 그린 LAN·POWER 배선은 지워집니다.</p>
    </fieldset>
    <fieldset class="wiring">
      <legend id="wiringTitle">LAN 배선</legend>
      <div class="seg" role="radiogroup" aria-label="배선 방식">
        <label><input type="radio" name="mode" value="auto" checked><span>자동</span></label>
        <label><input type="radio" name="mode" value="manual"><span>직접 그리기</span></label>
      </div>
      <input type="hidden" name="pat" value="hz-tl">
      <input type="hidden" name="tab" value="lan">
      <input type="hidden" name="ml" value="">
      <input type="hidden" name="powerMode" value="auto">
      <input type="hidden" name="powerPat" value="hz-tl">
      <input type="hidden" name="powerMl" value="">
      <input type="hidden" name="powerCur" value="">
      <div id="patterns" class="patterns" role="group" aria-label="배선 패턴"></div>
      <p id="patLabel" class="hint"></p>
      <p id="powerHint" class="hint" hidden>자동 배선은 포트당 500×500 기준 20장분 이내로 나눕니다. 500×1000은 2장분으로 계산하며, 직접 그리기는 초과해도 연결할 수 있습니다.</p>
      <div id="manualTools" hidden>
        <label class="chk"><input type="checkbox" id="panMode"> 이동 모드 (확대 후 터치로 화면 이동)</label>
        <div class="row2 tools">
          <button type="button" id="mUndo">되돌리기</button>
          <button type="button" id="mClear">모두 지우기</button>
        </div>
        <div class="cur">
          <label><span id="currentPortLabel">LAN 번호</span><input type="number" name="cur" min="1" step="1" inputmode="numeric" value="1"></label>
          <button type="button" id="mNew">새 LAN</button>
        </div>
        <p id="lineNotice" class="notice" role="alert" hidden></p>
        <ul id="lineList" class="lines"></ul>
      </div>
    </fieldset>

    <details>
      <summary>설정 (규칙)</summary>
      <div class="row2">
        <label>LAN 줄당 최대 캐비닛 수<input type="number" name="maxPerLine" inputmode="numeric" min="1" step="1" placeholder="자동(픽셀 기준)"></label>
      </div>
      <h3>아시바</h3>
      <div class="row2">
        <label>칸 수<input type="number" name="bays" inputmode="numeric" min="0" step="1" placeholder="자동"></label>
        <label>단(줄) 수<input type="number" name="tiers" inputmode="numeric" min="0" step="1" placeholder="자동"></label>
      </div>
      <input type="checkbox" name="topPlank" hidden aria-hidden="true">
      <input type="checkbox" name="baseEnabled" hidden aria-hidden="true">
      <input type="checkbox" name="stageEnabled" hidden aria-hidden="true">
      <input type="hidden" name="stageHeight">
    </details>
    <button type="button" id="reset" class="ghost">초기화</button>
  </form>

  <section class="panel">
    <div id="msgs"></div>
    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="도면 종류">
        <button type="button" role="tab" id="tabLan" data-tab="lan" aria-selected="true">LAN</button>
        <button type="button" role="tab" id="tabPw" data-tab="pw" aria-selected="false">POWER</button>
      </div>
      <span class="spacer"></span>
      <button type="button" id="zoomOut" aria-label="축소">−</button>
      <button type="button" id="zoomFit">맞춤</button>
      <button type="button" id="zoomIn" aria-label="확대">+</button>
    </div>
    <div id="printHead" class="print-only"></div>
    <div id="canvas" class="canvas" aria-label="배선도"></div>
    <div id="printCanvas" class="print-only" aria-hidden="true"></div>
    <div class="toolbar exports">
      <button type="button" id="expPng">PNG 저장</button>
      <button type="button" id="expPdf">PDF / 인쇄</button>
      <button type="button" id="expXlsx">엑셀 저장</button>
    </div>
  </section>

  <section class="panel" id="tables"></section>
</main>

<dialog id="errDialog" aria-labelledby="errTitle">
  <h2 id="errTitle"></h2>
  <p id="errBody"></p>
  <form method="dialog"><button autofocus>확인</button></form>
</dialog>

<script type="module" src="src/ui.js"></script>
</body>
</html>
